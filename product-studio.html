<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Product Studio | ArtisanConnect AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5efe7;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            background: #7b4b2a;
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            color: #3b281c;
            margin-top: 12px;
            font-size: 25px;
        }

        .subtitle {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        .upload-box {
            border: 2px dashed #c9a98d;
            border-radius: 16px;
            padding: 30px 15px;
            text-align: center;
            margin-top: 20px;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .
